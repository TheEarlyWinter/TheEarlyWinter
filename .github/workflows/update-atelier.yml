name: Update Early Winter Atelier Card

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:     # 支持在 GitHub 页面手动一键触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Atelier SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-atelier.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/atelier-card.svg
          if git diff --staged --quiet; then
            echo "🌸 No changes in Atelier metrics."
          else
            git commit -m "🌸 chore(atelier): update early winter telemetry card [skip ci]"
            git push
          fi
